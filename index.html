<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Hiro - My Animal</title>

    <!-- کتابخانه A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- کتابخانه AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
    >

        <!-- نشانگر پیش‌فرض Hiro -->
        <a-marker preset="hiro">

            <!-- 
                مدل حیوان شما:
                - مسیر gltf-model را با نام فایل خودتان تطبیق دهید.
                - position="0 0 0.1": مدل ۱۰ سانتی‌متر از مانیتور فاصله دارد.
                - rotation="0 180 0": مدل رو به شما چرخیده است.
                - scale="0.5 0.5 0.5": در صورت نیاز، اندازه را کم یا زیاد کنید.
            -->
            <a-entity
                gltf-model="./models/koenigsegg.glb"
                position="0 0 0.1"
                scale="0.5 0.5 0.5"
                rotation="0 180 0">
            </a-entity>

        </a-marker>

        <!-- دوربین گوشی -->
        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
