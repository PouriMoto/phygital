<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Marker Project</title>

    <!-- ۱. کتابخانه A-Frame (موتور سه‌بعدی) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- ۲. کتابخانه AR.js (نسخه Marker-Based) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
    >

        <!-- 
            نشانگر (Marker):
            - type="pattern": یعنی از فایل patt سفارشی استفاده می‌کنیم.
            - url: مسیر فایل patt (همانطور که در گام ۲ توضیح دادم).
            - size: اندازه واقعی نشانگر روی کاغذ (به متر). این پارامتر بسیار مهم است!
            - smooth: برای کاهش لرزش مدل.
        -->
        <a-marker 
            type="pattern" 
            url="./markers/my-marker.patt"
            size="0.15"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >

            <!-- 
                مدل حیوان:
                - position: موقعیت مدل نسبت به مرکز نشانگر. 
                  (0 0 0) یعنی دقیقاً روی نشانگر. اگر می‌خواهید کمی بالاتر باشد، Y را زیاد کنید (مثلاً 0 0.1 0).
                - scale: اندازه مدل. اگر مدل شما خیلی بزرگ/کوچک است، این عدد را تغییر دهید.
                - rotation: چرخش مدل.
            -->
            <a-entity
                gltf-model="./models/animal.glb"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="0 0 0">
            </a-entity>

        </a-marker>

        <!-- دوربین گوشی -->
        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
