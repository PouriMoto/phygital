<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Phygital Project</title>

    <!-- ۱. کتابخانه A-Frame (موتور سه‌بعدی) -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- ۲. کتابخانه AR.js (نسخه Marker-Based) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- صحنه اصلی AR -->
    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
    >

        <!-- 
            نشانگر (Marker):
            - url: نام فایل patt شما (بدون پسوند .patt در اینجا نوشته نمی‌شود، فقط نام فایل)
            - size: اندازه واقعی نشانگر روی کاغذ به متر (۰.۱۵ یعنی ۱۵ سانتی‌متر)
        -->
        <a-marker 
            type="pattern" 
            url="./my-marker.patt"
            size="0.15"
            smooth="true"
            smoothCount="10"
            smoothTolerance="0.01"
            smoothThreshold="5"
        >

            <!-- 
                مدل حیوان:
                فعلاً از یک مدل آنلاین (اردک) استفاده می‌کنیم تا مطمئن شویم کد کار می‌کند.
                بعداً می‌توانید این خط را با مدل خودتان (مثلاً ./models/lion.glb) جایگزین کنید.
            -->
            <a-entity
                gltf-model="https://cdn.jsdelivr.net/gh/KhronosGroup/glTF-Sample-Models@master/2.0/Duck/glTF-Binary/Duck.glb"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="0 0 0">
            </a-entity>

        </a-marker>

        <!-- دوربین گوشی -->
        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
