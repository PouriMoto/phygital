<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Koenigsegg - Marker Test</title>

    <!-- کتابخانه A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- کتابخانه AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
        renderer="logarithmicDepthBuffer: true;"
    >

        <!-- استفاده از فایل patt سفارشی Hiro -->
        <a-marker 
            type="pattern" 
            url="./marker/HIRO.patt"
        >

            <!-- 
                مدل ماشین Koenigsegg:
                - مسیر: ./models/koenigsegg.glb (اگر جای دیگری است، اصلاح کنید).
                - position="0 0 0.1": کمی از سطح نشانگر فاصله دارد.
                - scale="0.5 0.5 0.5": اندازه مدل (در صورت نیاز کم/زیاد کنید).
                - rotation="0 180 0": جهت مدل رو به شما.
            -->
            <a-entity
                gltf-model="./models/koenigsegg.glb"
                position="0 0 0.1"
                scale="0.5 0.5 0.5"
                rotation="0 180 0">
            </a-entity>

        </a-marker>

        <!-- دوربین گوشی -->
        <a-entity camera></a-entity>

    </a-scene>
</body>
</html>
